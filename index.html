<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WebNova-Weather-Website</title>
        <link rel="icon" type="image/png" href="weblogo.png">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <div class="weather_container">
                <div>
                    <p class="temp">30&deg;C</p>
                </div>
                <div class="location_time">
                    <p id="location">Location</p>
                    <p id="time">Time & Date</p>
                </div>
                <div class="condition">
                    <img class="weather_icon" src="" alt="">
                    <p>Mist</p>
                </div>
            </div>
            <form>
                <input type="text" placeholder="Search For Location" class="search_area">
                <button type="submit">Search Button</button>
            </form>
        </div>
        <footer>
            <p>
              Weather Website Developed By ❤️ 
              © 2026 Ashish Raj | WebNova | All Rights Reserved
            </p>
        </footer>
        <script src="script.js"></script>
    </body>
</html>
